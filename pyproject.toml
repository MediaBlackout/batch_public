[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "batch"
version = "0.1.0"
description = "Batch processing system"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Media Blackout LLC"}]

dependencies = [
    "boto3",
    "openai",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "types-boto3",
    "types-jsonschema"
]

[project.scripts]
batch = "batch.main:main"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable this
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module options
[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true
